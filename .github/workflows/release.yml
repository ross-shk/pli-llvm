# SPDX-License-Identifier: Apache-2.0
# CI: build release binaries for macOS (ARM64), Linux (x86_64 + ARM64) and Windows on tag push, then publish.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            asset: pli-linux-x86_64
            platdir: linux-x86_64
          - os: ubuntu-24.04-arm
            asset: pli-linux-aarch64
            platdir: linux-aarch64
          - os: macos-latest
            asset: pli-darwin-arm64
            platdir: darwin-arm64
          - os: windows-latest
            asset: pli-windows-x86_64
            platdir: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch static LLVM stash (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zstd curl
          sh scripts/fetch_llvm_static.sh --prefix "$HOME/pli-deps"

      - name: Fetch static LLVM stash (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zstd
          sh scripts/fetch_llvm_static.sh --prefix "$HOME/pli-deps"

      - name: Set up MSVC env (Windows SDK only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch static LLVM stash (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install zstd -y
          sh scripts/fetch_llvm_static.sh --prefix "$HOME/pli-deps"
          echo "$(cygpath -w "$HOME/pli-deps/bin")" >> "$GITHUB_PATH"

      - name: Configure (CMake + Ninja, static prefix)
        run: |
          # Prerequisite: the llvm-deps stash must be promoted first
          # (.github/workflows/llvm-deps.yml, workflow_dispatch); the pins
          # carry its checksums (scripts/llvm_static.pins).
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -G Ninja -S . -B build/cmake -DPLI_LLVM_STATIC_PREFIX="$HOME/pli-deps" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake -G Ninja -S . -B build/cmake -DPLI_LLVM_STATIC_PREFIX="$HOME/pli-deps"
          fi

      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build/cmake -j$NUMBER_OF_PROCESSORS
          else
            cmake --build build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          fi

      - name: Test
        continue-on-error: true
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build/cmake -j$NUMBER_OF_PROCESSORS
          else
            ctest --test-dir build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          fi

      - name: Strip, assert static, and pack (Unix)
        if: runner.os != 'Windows'
        run: |
          # Static-prefix build ships no lib/ dir: assert zero toolchain refs
          # and tar pli + its sibling clang (exe-relative resolution).
          strip -o build/cmake/pli.stripped build/cmake/pli
          mkdir -p ${{ matrix.platdir }}
          cp build/cmake/pli.stripped ${{ matrix.platdir }}/pli
          sh scripts/bundle_standalone.sh --assert-static ${{ matrix.platdir }}/pli
          sh scripts/bundle_standalone.sh --ship-clang "$HOME/pli-deps/bin" ${{ matrix.platdir }}
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.platdir }}

      - name: Pack into archives (Windows)
        if: runner.os == 'Windows'
        run: |
          # pli.exe is self-contained (embedded runtime bitcode + /MT): ship
          # it with its sibling clang.exe (exe-relative resolution). The
          # compiler-rt builtins resource dir is a promotion-time check: if a
          # user link needs __divti3 and the stash lacks builtins, pli
          # diagnoses it (main.cpp) instead of failing silently.
          mkdir -p ${{ matrix.platdir }}
          cp build/cmake/pli.exe ${{ matrix.platdir }}/pli.exe
          cp "$HOME/pli-deps/bin/clang.exe" ${{ matrix.platdir }}/clang.exe
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.platdir }}/pli.exe ${{ matrix.platdir }}/clang.exe
          powershell -NoProfile -Command "Compress-Archive -Path '${{ matrix.platdir }}/pli.exe','${{ matrix.platdir }}/clang.exe' -DestinationPath '${{ matrix.asset }}.zip'"

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n   end smoke;\n' > /tmp/smoke.pli
          ./${{ matrix.platdir }}/pli /tmp/smoke.pli -o /tmp/smoke && /tmp/smoke

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n   end smoke;\n' > /tmp/smoke.pli
          ./build/cmake/pli.exe /tmp/smoke.pli -o /tmp/smoke.exe && /tmp/smoke.exe

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
