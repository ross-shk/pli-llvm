# SPDX-License-Identifier: Apache-2.0
# CI: build release binaries for macOS (ARM64), Linux (x86_64 + ARM64) and Windows on tag push, then publish.
name: release

on:
  push:
    tags:
      - "v*"
  # Re-runnable from the Actions tab (e.g. after promoting an llvm-deps stash):
  # pass the existing tag so a failed/partial release can be rebuilt in place.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0)"
        required: false
        type: string

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            asset: pli-linux-x86_64
            platdir: linux-x86_64
          - os: ubuntu-24.04-arm
            asset: pli-linux-aarch64
            platdir: linux-aarch64
          - os: macos-latest
            asset: pli-darwin-arm64
            platdir: darwin-arm64
          - os: windows-latest
            asset: pli-windows-x86_64
            platdir: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      # Dispatch rebuilds must use the requested tag, not the dispatch branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Fetch static LLVM stash (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zstd curl
          sh scripts/fetch_llvm_static.sh --prefix "$HOME/pli-deps"

      - name: Fetch static LLVM stash (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zstd
          sh scripts/fetch_llvm_static.sh --prefix "$HOME/pli-deps"

      - name: Set up MSVC env (Windows SDK only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch static LLVM stash (Windows)
        if: runner.os == 'Windows'
        run: |
          # zstd ships preinstalled on windows-latest (C:\tools\zstd). The
          # chocolatey zstd package was removed from the community feed, so the
          # fallback grabs the official release binary instead of using choco.
          if ! command -v zstd >/dev/null 2>&1; then
            ZSTD_VER=$(awk -F= '/^ZSTD_VER=/{print $2; exit}' scripts/llvm_static.pins)
            ZDIR="$HOME/.pli-zstd"
            mkdir -p "$ZDIR"
            curl -fL --retry 3 -o "$ZDIR/zstd.zip" \
              "https://github.com/facebook/zstd/releases/download/v$ZSTD_VER/zstd-v$ZSTD_VER-win64.zip"
            powershell -NoProfile -Command \
              "Expand-Archive -Force '$(cygpath -w "$ZDIR/zstd.zip")' '$(cygpath -w "$ZDIR")'"
            echo "$(cygpath -w "$ZDIR/zstd-v$ZSTD_VER-win64")" >> "$GITHUB_PATH"
            export PATH="$ZDIR/zstd-v$ZSTD_VER-win64:$PATH"
          fi
          sh scripts/fetch_llvm_static.sh --prefix "$HOME/pli-deps"
          echo "$(cygpath -w "$HOME/pli-deps/bin")" >> "$GITHUB_PATH"

      - name: Configure (CMake + Ninja, static prefix)
        run: |
          # Prerequisite: the llvm-deps stash must be promoted first
          # (.github/workflows/llvm-deps.yml, workflow_dispatch); the pins
          # carry its checksums (scripts/llvm_static.pins).
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -G Ninja -S . -B build/cmake -DPLI_LLVM_STATIC_PREFIX="$HOME/pli-deps" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake -G Ninja -S . -B build/cmake -DPLI_LLVM_STATIC_PREFIX="$HOME/pli-deps" -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build/cmake -j$NUMBER_OF_PROCESSORS
          else
            cmake --build build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          fi

      # A red suite blocks the release: a tag can point at any commit, so the
      # pull-request gate in build.yml is not enough (A5).
      - name: Test
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build/cmake -j$NUMBER_OF_PROCESSORS
          else
            ctest --test-dir build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          fi

      - name: Strip, assert static, and pack (Unix)
        if: runner.os != 'Windows'
        run: |
          # Single-file release (ADR-225/227): assert zero toolchain refs and
          # tar pli alone — no lib/ dir, no shipped clang, no sysroot dirs.
          # The link sysroot is EMBEDDED in the binary (musl on Linux, SDK
          # stubs on macOS); the smoke test below links against the embedded
          # set. The embed holds the target arch from
          # platform/linux-musl/<arch>/ (checked in for x86_64 and aarch64).
          strip -o build/cmake/pli.stripped build/cmake/pli
          mkdir -p ${{ matrix.platdir }}
          cp build/cmake/pli.stripped ${{ matrix.platdir }}/pli
          sh scripts/bundle_standalone.sh --assert-static ${{ matrix.platdir }}/pli
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.platdir }}/pli

      - name: Pack into archives (Windows)
        if: runner.os == 'Windows'
        run: |
          # Single-file release (ADR-225/227): pli.exe is self-contained
          # (embedded runtime bitcode + embedded mingw sysroot + /MT) — ship
          # the binary alone, no shipped clang, no mingw/ sidecar. The
          # compiler-rt profile runtime (for --fprofile-generate) is resolved
          # exe-relative first, then the toolchain resource dir.
          mkdir -p ${{ matrix.platdir }}
          cp build/cmake/pli.exe ${{ matrix.platdir }}/pli.exe
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.platdir }}/pli.exe
          powershell -NoProfile -Command "Compress-Archive -Path '${{ matrix.platdir }}/pli.exe' -DestinationPath '${{ matrix.asset }}.zip'"

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n   end smoke;\n' > /tmp/smoke.pli
          ./${{ matrix.platdir }}/pli /tmp/smoke.pli -o /tmp/smoke && /tmp/smoke
          # Self-containment proof (ADR-227): a bogus sysroot must not break
          # the link — the embedded sysroot wins over the host recipe.
          PLI_SYSROOT=/nonexistent-pli-test ./${{ matrix.platdir }}/pli /tmp/smoke.pli -o /tmp/smoke2 && /tmp/smoke2

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n   end smoke;\n' > /tmp/smoke.pli
          ./build/cmake/pli.exe /tmp/smoke.pli -o /tmp/smoke.exe && /tmp/smoke.exe
          # Self-containment proof (ADR-227): an empty LIB must not break the
          # link — the embedded mingw sysroot wins over MSVC.
          env LIB= ./${{ matrix.platdir }}/pli.exe /tmp/smoke.pli -o /tmp/smoke2.exe && /tmp/smoke2.exe

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
