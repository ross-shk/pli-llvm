# SPDX-License-Identifier: Apache-2.0
# CI: build release binaries for macOS, Linux and Windows on tag push, then publish.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            asset: plic-linux-x86_64
            platdir: linux-x86_64
          - os: macos-latest
            asset: plic-darwin-arm64
            platdir: darwin-arm64
          - os: windows-latest
            asset: plic-windows-x86_64
            platdir: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(. /etc/os-release && echo $VERSION_CODENAME)/ llvm-toolchain-$(. /etc/os-release && echo $VERSION_CODENAME)-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23 llvm-23-dev libclang-23-dev liblld-23-dev libpolly-23-dev libclang-rt-23-dev ninja-build cmake python3 git
          sudo ln -sf /usr/bin/clang-23 /usr/bin/clang && sudo ln -sf /usr/bin/clang++-23 /usr/bin/clang++
          echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-23" >> "$GITHUB_ENV"

      - name: Install LLVM + lld (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm lld ninja cmake

      - name: Set up MSVC dev (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM 23 (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm ninja -y --version=23.1.3
          echo "CMAKE_PREFIX_PATH=C:\Program Files\LLVM" >> "$GITHUB_ENV"
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"

      - name: Configure (CMake + Ninja)
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -G Ninja -S . -B build/cmake -DCMAKE_PREFIX_PATH=$(brew --prefix llvm)
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cmake -G Ninja -S . -B build/cmake -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake -G Ninja -S . -B build/cmake -DCMAKE_PREFIX_PATH=/usr/lib/llvm-23
          fi

      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build/cmake -j$NUMBER_OF_PROCESSORS
          else
            cmake --build build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          fi

      - name: Test
        continue-on-error: true
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build/cmake -j$NUMBER_OF_PROCESSORS
          else
            ctest --test-dir build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          fi

      - name: Strip and pack into tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          strip -o build/cmake/plic.stripped build/cmake/plic
          mkdir -p ${{ matrix.platdir }}
          cp build/cmake/plic.stripped ${{ matrix.platdir }}/plic
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.platdir }}/plic

      - name: Pack into archives (Windows)
        if: runner.os == 'Windows'
        run: |
          # plic.exe is self-contained (embedded runtime bitcode); the static
          # lib + bitcode are bundled for cross-unit (-c) workflows.
          # Layout matches README: <platdir>/plic.exe + <platdir>/lib/... .
          mkdir -p ${{ matrix.platdir }}/lib
          cp build/cmake/plic.exe ${{ matrix.platdir }}/plic.exe
          cp build/cmake/pli.lib ${{ matrix.platdir }}/lib/pli.lib
          cp build/cmake/runtime.bc ${{ matrix.platdir }}/lib/runtime.bc
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.platdir }}
          powershell -NoProfile -Command "Compress-Archive -Path '${{ matrix.platdir }}' -DestinationPath '${{ matrix.asset }}.zip'"

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n   end smoke;\n' > /tmp/smoke.pli
          ./build/cmake/plic.stripped /tmp/smoke.pli -o /tmp/smoke && /tmp/smoke

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n   end smoke;\n' > /tmp/smoke.pli
          ./build/cmake/plic.exe /tmp/smoke.pli -o /tmp/smoke.exe && /tmp/smoke.exe

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          retention-days: 1

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
