# SPDX-License-Identifier: Apache-2.0
# CI: build release binaries for macOS and Linux on tag push, then publish.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset: plic-linux-x86_64
            platdir: linux-x86_64
          - os: macos-latest
            asset: plic-darwin-arm64
            platdir: darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(. /etc/os-release && echo $VERSION_CODENAME)/ llvm-toolchain-$(. /etc/os-release && echo $VERSION_CODENAME)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22 llvm-22-dev libclang-22-dev liblld-22-dev libpolly-22-dev libclang-rt-22-dev ninja-build cmake python3 git
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang && sudo ln -sf /usr/bin/clang++-22 /usr/bin/clang++
          echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install LLVM + lld (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm lld ninja cmake

      - name: Configure (CMake + Ninja)
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -G Ninja -S . -B build/cmake -DCMAKE_PREFIX_PATH=$(brew --prefix llvm)
          else
            cmake -G Ninja -S . -B build/cmake -DCMAKE_PREFIX_PATH=/usr/lib/llvm-22
          fi

      - name: Build
        run: cmake --build build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Test
        continue-on-error: true
        run: ctest --test-dir build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Strip and pack into tarball
        run: |
          strip -o build/cmake/plic.stripped build/cmake/plic
          mkdir -p ${{ matrix.platdir }}
          cp build/cmake/plic.stripped ${{ matrix.platdir }}/plic
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.platdir }}/plic

      - name: Smoke test
        run: |
          printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n   end smoke;\n' > /tmp/smoke.pli
          ./build/cmake/plic.stripped /tmp/smoke.pli -o /tmp/smoke && /tmp/smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
