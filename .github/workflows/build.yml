# CI: configure with CMake/Ninja, build, test, gate the size, smoke-test.
name: build
on:
  push:
  pull_request:

jobs:
  build-test:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(. /etc/os-release && echo $VERSION_CODENAME)/ llvm-toolchain-$(. /etc/os-release && echo $VERSION_CODENAME)-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23 llvm-23-dev libclang-23-dev liblld-23-dev libpolly-23-dev libclang-rt-23-dev ninja-build cmake python3 git
          sudo ln -sf /usr/bin/clang-23 /usr/bin/clang && sudo ln -sf /usr/bin/clang++-23 /usr/bin/clang++
          echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-23" >> "$GITHUB_ENV"
      - name: Install LLVM + lld (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm lld ninja cmake
      - name: Set up MSVC env (Windows SDK only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install LLVM 23 (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=23.1.3 -y
          choco install ninja -y
          echo "CMAKE_PREFIX_PATH=C:/Program Files/LLVM" >> "$GITHUB_ENV"
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
      - name: Configure (CMake + Ninja)
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -G Ninja -S . -B build/cmake -DCMAKE_PREFIX_PATH=$(brew --prefix llvm)
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cmake -G Ninja -S . -B build/cmake -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake -G Ninja -S . -B build/cmake -DCMAKE_PREFIX_PATH=/usr/lib/llvm-23
          fi
      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build/cmake -j$NUMBER_OF_PROCESSORS
          else
            cmake --build build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          fi
      - name: Test
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build/cmake -j$NUMBER_OF_PROCESSORS
          else
            ctest --test-dir build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          fi
      - name: Size gate (stripped < 150 MB)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            llvm-objcopy --strip-all -o /tmp/pli.strip build/cmake/pli.exe
            bytes=$(stat -c%s /tmp/pli.strip 2>/dev/null || stat -f%z /tmp/pli.strip)
            echo "Stripped size: $bytes bytes"
            test "$bytes" -lt 157286400
          else
            strip -o /tmp/pli.strip build/cmake/pli
            bytes=$(stat -f%z /tmp/pli.strip 2>/dev/null || stat -c%s /tmp/pli.strip)
            echo "Stripped size: $bytes bytes"
            test "$bytes" -lt 157286400
          fi
      - name: Smoke (pure PL/I end-to-end)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n end smoke;\n' > /tmp/smoke.pli
            ./build/cmake/pli.exe /tmp/smoke.pli -o /tmp/smoke.exe && /tmp/smoke.exe
            ./build/cmake/pli.exe version
          else
            printf ' smoke: proc options(main);\n   put list('"'"'ok'"'"');\n end smoke;\n' > /tmp/smoke.pli
            ./build/cmake/pli /tmp/smoke.pli -o /tmp/smoke && /tmp/smoke
            ./build/cmake/pli version
          fi
      - name: Upload pli binary (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pli-${{ matrix.os }}
          path: build/cmake/pli
      - name: Upload pli binary (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pli-${{ matrix.os }}
          path: build/cmake/pli.exe

  # Cross-compilation (ADR-234): the per-target runtime bitcode and the
  # target link sysroots. The sysroots are prepared in containers (docker is
  # available on the runner), then the cross-enabled compiler is built and
  # the produced binaries are executed.
  cross:
    name: cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM + lld (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/$(. /etc/os-release && echo $VERSION_CODENAME)/ llvm-toolchain-$(. /etc/os-release && echo $VERSION_CODENAME)-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-23 lld-23 llvm-23 llvm-23-dev libclang-23-dev liblld-23-dev libpolly-23-dev libclang-rt-23-dev ninja-build cmake python3 git
          # The aarch64 cross binary is run through qemu (the runner is amd64).
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo ln -sf /usr/bin/clang-23 /usr/bin/clang && sudo ln -sf /usr/bin/clang++-23 /usr/bin/clang++
          echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-23" >> "$GITHUB_ENV"
      - name: Prepare the cross sysroots
        run: |
          sh scripts/prepare_cross_sysroot.sh x86_64-unknown-linux-gnu
          sh scripts/prepare_cross_sysroot.sh aarch64-unknown-linux-gnu
          sh scripts/prepare_cross_sysroot.sh x86_64-pc-windows-gnu
      - name: Configure (cross bitcode)
        run: |
          cmake -G Ninja -S . -B build/cmake -DPLI_CROSS_BITCODE=ON -DPLI_CROSS_REQUIRE_ALL=ON -DCMAKE_PREFIX_PATH=/usr/lib/llvm-23
      - name: Build
        run: cmake --build build/cmake -j$(nproc)
      - name: Cross driver tests
        run: python3 tests/run_tests.py driver
      - name: Cross binaries run (Linux)
        run: |
          ./build/cmake/pli --triple x86_64-unknown-linux-gnu tests/core/hello.pli -o /tmp/hello-linux-x86_64
          ./build/cmake/pli --triple aarch64-unknown-linux-gnu tests/core/hello.pli -o /tmp/hello-linux-aarch64
          docker run --rm -v /tmp:/t debian:trixie-slim /t/hello-linux-x86_64
          docker run --rm --platform linux/arm64 -v /tmp:/t debian:trixie-slim /t/hello-linux-aarch64
      - name: Cross binary under Wine (Windows)
        run: |
          ./build/cmake/pli --triple x86_64-pc-windows-gnu tests/core/hello.pli -o /tmp/hello-windows-x86_64.exe
          docker build -f docker/Dockerfile.wine-test -t pli-wine-test docker
          docker run --rm -v /tmp:/t pli-wine-test wine64 /t/hello-windows-x86_64.exe
